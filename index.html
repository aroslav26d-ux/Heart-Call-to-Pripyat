<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ЗОНА — Стрілок, Артефакт і Барига</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0a0d0b;
      color: #dce6dd;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100dvh;
      padding: 6px 8px;
      gap: 6px;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
      font-size: 13px;
      color: #a3b8a6;
      max-width: 840px;
    }
    .hud b { color: #f2f9f3; }
    .money b { color: #8ce99a; }
    canvas {
      border: 2px solid #324436;
      background: #121714;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: auto;
      height: auto;
      max-width: min(840px, 96vw);
      max-height: calc(100dvh - 185px);
      aspect-ratio: 840 / 600;
      display: block;
    }
    .controls {
      display: flex;
      width: 100%;
      max-width: 840px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 2px 4px;
      user-select: none;
      flex-shrink: 0;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 40px);
      gap: 4px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .btn {
      background: #18211b;
      color: #e6f0e7;
      border: 1px solid #3b5240;
      border-radius: 8px;
      font-family: monospace;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      cursor: pointer;
    }
    .btn:active, .btn.active {
      background: #2d4233;
      border-color: #8ce99a;
    }
    .btn-action {
      min-width: 116px;
      height: 44px;
      font-size: 13px;
      padding: 0 10px;
    }
    .empty { pointer-events: none; visibility: hidden; }
  </style>
</head>
<body>
  <div class="hud">
    <span>Артефактів: <b id="invCount">0</b></span>
    <span class="money">Гроші: <b id="money">0 грн</b></span>
    <span>Стан: <b id="status">Пошук</b></span>
  </div>

  <canvas id="game" width="840" height="600"></canvas>

  <div class="controls" aria-label="Керування">
    <div class="dpad">
      <div class="empty"></div>
      <button class="btn" data-dir="up" type="button">↑</button>
      <div class="empty"></div>
      <button class="btn" data-dir="left" type="button">←</button>
      <div class="empty"></div>
      <button class="btn" data-dir="right" type="button">→</button>
      <div class="empty"></div>
      <button class="btn" data-dir="down" type="button">↓</button>
      <div class="empty"></div>
    </div>

    <div class="actions">
      <button class="btn btn-action" id="btnF" type="button">[F] ДІЯ</button>
      <button class="btn btn-action" id="btnE" type="button">[E] РУКА</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const invCountEl = document.getElementById("invCount");
    const moneyEl = document.getElementById("money");
    const statusEl = document.getElementById("status");

    const TILE_SIZE = 40;
    const COLS = Math.floor(canvas.width / TILE_SIZE);  // 21
    const ROWS = Math.floor(canvas.height / TILE_SIZE); // 15

    const MAX_ARTIFACTS_ON_MAP = 1;
    const ARTIFACT_RESPAWN_SEC = 10.0;
    const ARTIFACT_PRICE = 250;

    const sprites = {
      right: null,
      left: null,
      artifactPose: null,
      artifact: null,
      trader: null
    };

    function cleanWhiteBackground(img) {
      try {
        const off = document.createElement("canvas");
        off.width = img.width;
        off.height = img.height;
        const octx = off.getContext("2d");
        octx.drawImage(img, 0, 0);
        const data = octx.getImageData(0, 0, off.width, off.height);
        const px = data.data;
        for (let i = 0; i < px.length; i += 4) {
          if (px[i] > 240 && px[i + 1] > 240 && px[i + 2] > 240) {
            px[i + 3] = 0;
          }
        }
        octx.putImageData(data, 0, 0);
        return off;
      } catch (e) {
        return img;
      }
    }

    function loadSprite(key, sources) {
      const list = Array.isArray(sources) ? sources : [sources];
      let idx = 0;

      function tryNext() {
        if (idx >= list.length) {
          sprites[key] = null;
          return;
        }
        const img = new Image();
        img.onload = () => {
          sprites[key] = cleanWhiteBackground(img);
        };
        img.onerror = () => {
          idx++;
          tryNext();
        };
        img.src = list[idx];
      }

      tryNext();
    }

    loadSprite("right", ["стрелок.png", "стрелок_2.png"]);
    loadSprite("left", ["стрелок (1).png", "стрелок (1)_2.png"]);
    loadSprite("artifactPose", ["стрелок (2).png", "стрелок (2)_2.png"]);
    loadSprite("artifact", ["texture_3.png", "texture_2.png", "texture.png"]);
    loadSprite("trader", ["і.png", "барига.png"]);

    const trader = {
      x: 16,
      y: 2,
      w: 2,
      h: 2,
      speechTimer: 0,
      speechText: ""
    };

    const player = {
      x: 4,
      y: 8,
      renderX: 4,
      renderY: 8,
      facing: "right",
      artifactsHeld: 0,
      money: 0,
      holdingActive: false,
      holdTimer: 0,
      walkAnimTimer: 0,
      walkSide: 1,
      pickingUp: false,
      pickupProgress: 0,
      pickupDuration: 0.45,
      targetArtifact: null
    };

    let artifacts = [
      { x: 9, y: 8 }
    ];
    let respawnTimer = 0;

    function isBlockedByTrader(tx, ty) {
      return (
        tx >= trader.x &&
        tx < trader.x + trader.w &&
        ty >= trader.y &&
        ty < trader.y + trader.h
      );
    }

    function getNearbyArtifact() {
      let best = null;
      let bestDist = Infinity;
      for (const a of artifacts) {
        const dist = Math.hypot(a.x - player.x, a.y - player.y);
        if (dist <= 2.2 && dist < bestDist) {
          bestDist = dist;
          best = a;
        }
      }
      return best;
    }

    function isNearTrader() {
      for (let ty = trader.y; ty < trader.y + trader.h; ty++) {
        for (let tx = trader.x; tx < trader.x + trader.w; tx++) {
          if (Math.hypot(tx - player.x, ty - player.y) <= 2.5) {
            return true;
          }
        }
      }
      return false;
    }

    function spawnArtifact() {
      if (artifacts.length >= MAX_ARTIFACTS_ON_MAP) return;
      let nx, ny, guard = 0;
      do {
        nx = Math.floor(Math.random() * COLS);
        ny = Math.floor(Math.random() * ROWS);
        guard++;
      } while (
        guard < 400 &&
        (isBlockedByTrader(nx, ny) || Math.hypot(nx - player.x, ny - player.y) < 5)
      );

      if (!isBlockedByTrader(nx, ny)) {
        artifacts = [{ x: nx, y: ny }];
      }
    }

    function updateHud() {
      invCountEl.textContent = player.artifactsHeld;
      moneyEl.textContent = `${player.money} грн`;

      if (player.pickingUp) {
        statusEl.textContent = "Підіймає артефакт...";
      } else if (isNearTrader() && player.artifactsHeld > 0) {
        statusEl.textContent = `Тисни F — продати за ${ARTIFACT_PRICE} грн`;
      } else if (getNearbyArtifact()) {
        statusEl.textContent = "Артефакт поруч — тисни F";
      } else if (player.artifactsHeld > 0 && player.holdingActive) {
        statusEl.textContent = "Тримає артефакт";
      } else if (player.artifactsHeld > 0) {
        statusEl.textContent = "Артефакт є (E — показати)";
      } else {
        statusEl.textContent = "Пошук";
      }
    }

    function movePlayer(dx, dy) {
      if (player.pickingUp) return;

      if (dx > 0) player.facing = "right";
      else if (dx < 0) player.facing = "left";

      const nx = player.x + dx;
      const ny = player.y + dy;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
        updateHud();
        return;
      }
      if (isBlockedByTrader(nx, ny)) {
        updateHud();
        return;
      }

      player.x = nx;
      player.y = ny;
      player.walkAnimTimer = 0.25;
      player.walkSide *= -1;
      updateHud();
    }

    function sellArtifactsToTrader() {
      if (player.artifactsHeld <= 0) {
        trader.speechText = "Нема артефакту — йди шукай.";
        trader.speechTimer = 2.0;
        return;
      }
      const soldCount = player.artifactsHeld;
      const earned = soldCount * ARTIFACT_PRICE;
      player.artifactsHeld = 0;
      player.money += earned;
      player.holdingActive = false;
      player.holdTimer = 0;

      trader.speechText = `Беру! +${earned} грн`;
      trader.speechTimer = 2.5;
      updateHud();
    }

    function handleInteractF() {
      if (player.pickingUp) return;

      const nearArt = getNearbyArtifact();
      if (nearArt) {
        if (nearArt.x > player.x) player.facing = "right";
        else if (nearArt.x < player.x) player.facing = "left";

        player.pickingUp = true;
        player.pickupProgress = 0;
        player.targetArtifact = nearArt;
        updateHud();
        return;
      }

      if (isNearTrader()) {
        const traderCenterX = trader.x + trader.w / 2;
        player.facing = traderCenterX >= player.x ? "right" : "left";
        sellArtifactsToTrader();
      }
    }

    function handleToggleHoldE() {
      if (player.artifactsHeld > 0 && !player.pickingUp) {
        player.holdingActive = !player.holdingActive;
        player.holdTimer = player.holdingActive ? 4.0 : 0;
        updateHud();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowRight" || e.code === "KeyD") {
        e.preventDefault();
        movePlayer(1, 0);
      } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
        e.preventDefault();
        movePlayer(-1, 0);
      } else if (e.code === "ArrowUp" || e.code === "KeyW") {
        e.preventDefault();
        movePlayer(0, -1);
      } else if (e.code === "ArrowDown" || e.code === "KeyS") {
        e.preventDefault();
        movePlayer(0, 1);
      } else if (e.code === "KeyF") {
        e.preventDefault();
        handleInteractF();
      } else if (e.code === "KeyE" || e.code === "Space") {
        e.preventDefault();
        handleToggleHoldE();
      }
    });

    const dirMap = {
      up: [0, -1],
      down: [0, 1],
      left: [-1, 0],
      right: [1, 0]
    };

    document.querySelectorAll("[data-dir]").forEach((btn) => {
      const [dx, dy] = dirMap[btn.dataset.dir];
      let repeatTimer = null;
      let repeatInterval = null;

      const startPress = (e) => {
        e.preventDefault();
        btn.classList.add("active");
        movePlayer(dx, dy);
        clearTimeout(repeatTimer);
        clearInterval(repeatInterval);
        repeatTimer = setTimeout(() => {
          repeatInterval = setInterval(() => movePlayer(dx, dy), 140);
        }, 250);
      };

      const endPress = () => {
        btn.classList.remove("active");
        clearTimeout(repeatTimer);
        clearInterval(repeatInterval);
      };

      btn.addEventListener("pointerdown", startPress);
      btn.addEventListener("pointerup", endPress);
      btn.addEventListener("pointerleave", endPress);
      btn.addEventListener("pointercancel", endPress);
    });

    const btnF = document.getElementById("btnF");
    const btnE = document.getElementById("btnE");

    btnF.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      btnF.classList.add("active");
      handleInteractF();
    });
    btnF.addEventListener("pointerup", () => btnF.classList.remove("active"));
    btnF.addEventListener("pointercancel", () => btnF.classList.remove("active"));

    btnE.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      btnE.classList.add("active");
      handleToggleHoldE();
    });
    btnE.addEventListener("pointerup", () => btnE.classList.remove("active"));
    btnE.addEventListener("pointercancel", () => btnE.classList.remove("active"));

    canvas.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch" && (getNearbyArtifact() || isNearTrader())) {
        e.preventDefault();
        handleInteractF();
      }
    });

    function drawGroundAndGrid() {
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;
          ctx.fillStyle = (x + y) % 2 === 0 ? "#151b17" : "#121714";
          ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

          ctx.strokeStyle = "#1f2922";
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
        }
      }
    }

    function drawTrader(time) {
      const px = trader.x * TILE_SIZE;
      const py = trader.y * TILE_SIZE;
      const w = trader.w * TILE_SIZE;
      const h = trader.h * TILE_SIZE;

      ctx.save();
      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.fillRect(px + 4, py + h - 4, w - 8, 8);

      if (sprites.trader) {
        const bob = Math.sin(time * 0.003) * 1.5;
        ctx.drawImage(sprites.trader, px, py + bob, w, h);
      } else {
        ctx.fillStyle = "#5c3419";
        ctx.fillRect(px + 4, py + 4, w - 8, h - 8);
      }

      ctx.font = "bold 12px monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#e6cfa3";
      ctx.fillText("БАРИГА", px + w / 2, py - 8);

      if (isNearTrader() && player.artifactsHeld > 0 && !player.pickingUp) {
        ctx.fillStyle = "#8ce99a";
        ctx.fillText(`[F] Продати (${player.artifactsHeld * ARTIFACT_PRICE} грн)`, px + w / 2, py + h + 16);
      }

      if (trader.speechTimer > 0 && trader.speechText) {
        ctx.fillStyle = "#fff3bf";
        ctx.fillText(trader.speechText, px + w / 2, py - 24);
      }

      ctx.restore();
    }

    function drawArtifactSprite(cx, cy, size, time) {
      const pulse = 0.75 + 0.25 * Math.sin(time * 0.008);

      ctx.save();
      const grad = ctx.createRadialGradient(cx, cy, size * 0.05, cx, cy, size * 0.52 * pulse);
      grad.addColorStop(0, "rgba(75, 165, 255, 0.45)");
      grad.addColorStop(0.6, "rgba(35, 110, 235, 0.18)");
      grad.addColorStop(1, "rgba(35, 110, 235, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.52 * pulse, 0, Math.PI * 2);
      ctx.fill();

      if (sprites.artifact) {
        ctx.drawImage(sprites.artifact, cx - size / 2, cy - size / 2, size, size);
      } else {
        ctx.fillStyle = "#2d7dff";
        ctx.beginPath();
        ctx.arc(cx, cy, size * 0.36, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawArtifacts(time) {
      const artSize = TILE_SIZE * 1.25;
      const nearby = getNearbyArtifact();

      for (const art of artifacts) {
        if (player.pickingUp && art === player.targetArtifact) continue;

        const cx = art.x * TILE_SIZE + TILE_SIZE / 2;
        const cy = art.y * TILE_SIZE + TILE_SIZE / 2 + Math.sin(time * 0.004 + art.x) * 2;

        drawArtifactSprite(cx, cy, artSize, time);

        if (!player.pickingUp && art === nearby) {
          ctx.save();
          ctx.font = "bold 13px monospace";
          ctx.textAlign = "center";
          ctx.fillStyle = "#9fd0ff";
          ctx.fillText("[F] Підняти", cx, art.y * TILE_SIZE - 6);
          ctx.restore();
        }
      }

      if (artifacts.length === 0) {
        const leftSec = Math.max(0, Math.ceil(ARTIFACT_RESPAWN_SEC - respawnTimer));
        ctx.save();
        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = "#6e8071";
        ctx.fillText(`Наступний артефакт через ${leftSec}с`, canvas.width / 2, canvas.height - 12);
        ctx.restore();
      }
    }

    function drawPlayer(time) {
      player.renderX += (player.x - player.renderX) * 0.35;
      player.renderY += (player.y - player.renderY) * 0.35;

      const stalkerSize = TILE_SIZE * 3.5;
      const centerX = player.renderX * TILE_SIZE + TILE_SIZE / 2;
      const bottomY = player.renderY * TILE_SIZE + TILE_SIZE * 0.92;

      const isWalking = player.walkAnimTimer > 0;
      const walkWave = isWalking ? Math.sin((0.25 - player.walkAnimTimer) * 28) * player.walkSide : 0;

      let crouchOffset = 0;
      let tiltAngle = isWalking ? walkWave * 0.05 : 0;

      if (player.pickingUp) {
        const p = Math.sin(player.pickupProgress * Math.PI);
        crouchOffset = p * 14;
        tiltAngle = (player.facing === "right" ? 1 : -1) * p * 0.14;
      }

      const bounce = isWalking ? -Math.abs(walkWave) * 5 : 0;
      const holding = !player.pickingUp && player.artifactsHeld > 0 && player.holdingActive;

      let sprite = player.facing === "right" ? sprites.right : sprites.left;
      if (holding && sprites.artifactPose) {
        sprite = sprites.artifactPose;
      }

      const targetHandX = player.facing === "right" ? stalkerSize * 0.27 : -stalkerSize * 0.27;
      const targetHandY = -stalkerSize * 0.02;

      ctx.save();

      ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
      ctx.beginPath();
      ctx.ellipse(centerX, bottomY, TILE_SIZE * 0.85, TILE_SIZE * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(centerX, bottomY - stalkerSize * 0.5 + crouchOffset + bounce);
      ctx.rotate(tiltAngle);

      if (sprite) {
        ctx.drawImage(sprite, -stalkerSize / 2, -stalkerSize / 2, stalkerSize, stalkerSize);
      } else {
        ctx.fillStyle = "#3c5740";
        ctx.fillRect(-stalkerSize * 0.25, -stalkerSize * 0.35, stalkerSize * 0.5, stalkerSize * 0.7);
      }

      if (player.pickingUp && player.targetArtifact) {
        const startX = (player.targetArtifact.x * TILE_SIZE + TILE_SIZE / 2) - centerX;
        const startY = (player.targetArtifact.y * TILE_SIZE + TILE_SIZE / 2) - (bottomY - stalkerSize * 0.5 + crouchOffset + bounce);

        const t = player.pickupProgress;
        const ease = 1 - Math.pow(1 - t, 3);
        const ax = startX + (targetHandX - startX) * ease;
        const ay = startY + (targetHandY - startY) * ease - Math.sin(t * Math.PI) * 28;

        drawArtifactSprite(ax, ay, TILE_SIZE * 1.15, time);
      }

      if (holding) {
        const lift = Math.sin(time * 0.01) * 4;
        drawArtifactSprite(targetHandX, targetHandY + lift, TILE_SIZE * 1.15, time);
      }

      ctx.restore();
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      if (trader.speechTimer > 0) {
        trader.speechTimer = Math.max(0, trader.speechTimer - dt);
      }

      if (artifacts.length < MAX_ARTIFACTS_ON_MAP) {
        respawnTimer += dt;
        if (respawnTimer >= ARTIFACT_RESPAWN_SEC) {
          respawnTimer = 0;
          spawnArtifact();
          updateHud();
        }
      } else {
        respawnTimer = 0;
      }

      if (player.walkAnimTimer > 0) {
        player.walkAnimTimer = Math.max(0, player.walkAnimTimer - dt);
      }

      if (player.pickingUp) {
        player.pickupProgress += dt / player.pickupDuration;
        if (player.pickupProgress >= 1) {
          player.pickingUp = false;
          player.pickupProgress = 0;

          const idx = artifacts.indexOf(player.targetArtifact);
          if (idx !== -1) {
            artifacts.splice(idx, 1);
            respawnTimer = 0;
            player.artifactsHeld += 1;
            player.holdingActive = true;
            player.holdTimer = 4.0;
          }
          player.targetArtifact = null;
          updateHud();
        }
      } else if (player.holdingActive && player.holdTimer > 0) {
        player.holdTimer -= dt;
        if (player.holdTimer <= 0) {
          player.holdingActive = false;
          updateHud();
        }
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.imageSmoothingEnabled = false;

      drawGroundAndGrid();
      drawTrader(now);
      drawArtifacts(now);
      drawPlayer(now);

      requestAnimationFrame(loop);
    }

    updateHud();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
